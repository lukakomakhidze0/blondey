<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e8,#ffeef7);
overflow:hidden;
}

.card{
width:360px;
background:white;
padding:35px;
border-radius:30px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
font-size:35px;
margin-bottom:15px;
}

h2{
color:#ff2f92;
margin-bottom:20px;
font-size:32px;
}

p{
font-size:28px;
font-weight:bold;
margin-bottom:30px;
}

button{
width:180px;
height:60px;
border:none;
border-radius:40px;
font-size:24px;
cursor:pointer;
transition:.2s;
}

#yes{
background:#ff2f92;
color:white;
}

#yes:hover{
transform:scale(1.08);
}

#no{
background:#bfbfbf;
color:white;
position:fixed;
left:50%;
top:70%;
transform:translateX(-50%);
}
</style>
</head>

<body>

<div class="card">
<h1>🐱💕🐱</h1>

<h2>Mariam</h2>

<p>Can we hang out? 🥹</p>

<button id="yes">Yes ❤️</button>

</div>

<button id="no">No 😿</button>

<script>

const no=document.getElementById("no");

function moveButton(){

const x=Math.random()*(window.innerWidth-180);
const y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";
no.style.top=y+"px";
}

no.addEventListener("mouseover",moveButton);
no.addEventListener("touchstart",(e)=>{
e.preventDefault();
moveButton();
});

document.getElementById("yes").onclick=function(){

document.body.innerHTML=`
<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e8,#ffeef7);
font-family:Arial;
text-align:center;
flex-direction:column;
">

<h1 style="font-size:60px;">❤️🥹❤️</h1>

<h2 style="color:#ff2f92;font-size:40px;">
Yay!! ❤️
</h2>

<p style="font-size:28px;">
Can't wait to see you, Mariam! 🥰
</p>

</div>
`;

};

</script>

</body>
